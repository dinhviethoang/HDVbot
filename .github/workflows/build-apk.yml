name: Build APK

on:
  push:
    branches:
      - rieng
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Fix PCM Player Plugin Namespace
        run: |
          PCM_DIR="$HOME/.pub-cache/hosted/pub.dev/flutter_pcm_player-0.0.1/android"
          GRADLE_FILE="$PCM_DIR/build.gradle"
          MANIFEST_FILE="$PCM_DIR/src/main/AndroidManifest.xml"
          if grep -q "namespace" "$GRADLE_FILE"; then
            sed -i -E "s/namespace[ =]+[^ ]+/namespace \"com.lhht.flutter_pcm_player\"/" "$GRADLE_FILE"
          else
            sed -i '/android {/a \    namespace "com.lhht.flutter_pcm_player"' "$GRADLE_FILE"
          fi
          sed -i -E 's/[[:space:]]+package="[^"]*"//' "$MANIFEST_FILE"
          echo "--- build.gradle"; cat "$GRADLE_FILE"
          echo "--- AndroidManifest.xml"; cat "$MANIFEST_FILE"

      - name: Build APK Release Split per ABI
        run: flutter build apk --release --split-per-abi

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hdvbot-apk-release
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 7

      - name: Rename APK for phone
        run: cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk HDVbot.apk

      - name: Publish Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: HDVbot build ${{ github.run_number }}
          files: HDVbot.apk
          make_latest: true
